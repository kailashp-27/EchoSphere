idth="2"/><text x="1155.0" y="218" text-anchor="middle" font-family="Arial" font-size="24" fill="#172134">Graph</text><text x="1155.0" y="250" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">_id, documentId (unique)</text><text x="1155.0" y="276" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">nodes[] and links[]</text><text x="1155.0" y="302" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">createdAt</text><rect x="55" y="350" width="310" height="170" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="383" text-anchor="middle" font-family="Arial" font-size="24" fill="#172134">SavedPrompt</text><text x="210.0" y="415" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">_id, title, prompt, category</text><text x="210.0" y="441" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">createdAt, updatedAt</text><path d="M355,85 L515,85" stroke="#334155" stroke-width="2" fill="none" /><text x="435" y="70" text-anchor="middle" font-family="Arial" font-size="18" fill="#172134">0..* documents</text><path d="M355,170 L515,410" stroke="#334155" stroke-width="2" fill="none" /><text x="405" y="300" text-anchor="middle" font-family="Arial" font-size="18" fill="#172134">0..* notes</text><path d="M845,150 L985,230" stroke="#334155" stroke-width="2" fill="none" /><text x="920" y="150" text-anchor="middle" font-family="Arial" font-size="18" fill="#172134">0..1 graph</text><path d="M845,410 L985,325" stroke="#334155" stroke-width="2" fill="none" /><text x="930" y="405" text-anchor="middle" font-family="Arial" font-size="18" fill="#172134">0..1 graph</text><text x="235" y="235" text-anchor="middle" font-family="Arial" font-size="20" fill="#172134">Folder hierarchy</text><text x="235" y="265" text-anchor="middle" font-family="Arial" font-size="18" fill="#172134">0..1 parent and 0..* children</text><text x="700" y="585" text-anchor="middle" font-family="Arial" font-size="22" fill="#172134">Graph.documentId logically identifies a Document or Note; MongoDB does not enforce a foreign key.</text><text x="700" y="620" text-anchor="middle" font-family="Arial" font-size="21" fill="#172134">SavedPrompt is independent. LanceDB chunks use documentId to associate vectors with stored content.</text></svg>